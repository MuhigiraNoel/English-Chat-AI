<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Room</title>
<link rel="icon" type="image/png" href="/Image/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">My Free4Talk</div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#">Rooms</a></li>
        <li><a href="login.html">Login</a></li
        <li><a href="register.html">Register</a></li>
    </ul>
</nav>

<div class="form-container">

<h1>Create a New Room</h1>

<form id="createRoomForm">

<label>Room Name</label>

<input
type="text"
id="roomName"
placeholder="Example: English Beginners">

<label>Language</label>

<select id="roomLanguage">
<option>English</option>
<option>French</option>
<option>Kinyarwanda</option>
<option>Swahili</option>
</select>

<label>Level</label>

<select id="roomLevel">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
</select>

<label>Maximum Participants</label>

<input
type="number"
id="maxParticipants"
placeholder="20">

<button type="submit">Create Room</button>

</form>

</div>
<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

document.getElementById("createRoomForm").addEventListener("submit", function(event){

    event.preventDefault();

    socket.emit("create-room", {

        roomName: document.getElementById("roomName").value,

        language: document.getElementById("roomLanguage").value,

        level: document.getElementById("roomLevel").value,

        maxParticipants: document.getElementById("maxParticipants").value

    });

    alert("Room information sent!");

});

</script>
</body>
</html>
